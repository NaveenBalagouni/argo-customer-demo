{{- if not .Values.deployAllApps }}
apiVersion: batch/v1
kind: Job
metadata:
  name: delete-applications-{{ randAlphaNum 5 | lower }}
  namespace: argocd
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: cleanup
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Deleting Argo CD applications and appsets..."
              kubectl delete application test-suite -n argocd --ignore-not-found
              kubectl delete applicationset test-suite-root-appset -n argocd --ignore-not-found
      restartPolicy: Never
{{- end }}
